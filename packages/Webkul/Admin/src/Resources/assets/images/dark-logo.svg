<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 79" width="300" height="79" fill="none">
    <defs>
        <!-- Blue Gradient for Emblem -->
        <linearGradient id="javaCrmGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>

        <filter id="subtleShadowDark" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Emblem Group -->
    <g transform="translate(10, 9.5)">
        <!-- Outer Glowing Ring / Shield Fragment -->
        <rect x="2" y="2" width="56" height="56" rx="16" fill="url(#javaCrmGradDark)" filter="url(#subtleShadowDark)" />
        
        <!-- Curved Stylized 'J' & Growth Chart Node -->
        <path d="M 18 18 L 38 18 C 42 18 44 20 44 24 L 44 38 C 44 44 38 48 30 48 C 22 48 18 44 18 40" 
              stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Growth Trend Nodes -->
        <circle cx="24" cy="38" r="3.5" fill="#ffffff" />
        <circle cx="33" cy="30" r="3.5" fill="#ffffff" />
        <circle cx="42" cy="20" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
        <path d="M 24 38 L 33 30 L 42 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text Group (Dark Mode: 'Java' in #ffffff, 'CRM' in #38bdf8) -->
    <g transform="translate(82, 51)">
        <!-- Java -->
        <text font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-0.5">Java</text>
        <!-- CRM -->
        <text x="78" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#38bdf8" letter-spacing="0">CRM</text>
    </g>
</svg>
